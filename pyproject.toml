[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ctxroute"
version = "0.1.0"
description = "Budget-bounded experiments for context compression and model routing"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
ctxroute = "ctxroute.cli:main"

[project.optional-dependencies]
runtime = [
    "mcp>=1,<2",
    "mini-swe-agent==2.4.6",
    "pydantic-ai-slim[openai]>=2.59.0",
    "swebench>=5.0.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "pyright>=1.1.400", "pyyaml>=6", "types-pyyaml>=6"]
data = ["pyarrow>=19"]

[tool.hatch.build.targets.wheel]
packages = ["src/ctxroute"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
